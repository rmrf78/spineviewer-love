name: Linux Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: v1.0.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
            artifact: x64
          - runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
            artifact: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-xinerama0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb-icccm4-dev libxcb-cursor0 \
            libegl1 libgles2 libglvnd0 libgl1 \
            libfontconfig1 libfreetype6 libharfbuzz0b libpng16-16 libjpeg-turbo8 \
            libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
            libx11-xcb1 libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxrandr2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt -O /opt/qt ${{ matrix.qt_host }} desktop 6.8.3 ${{ matrix.qt_arch }} -m qtshadertools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/qt/6.8.3/${{ matrix.qt_dir }}

      - name: Build
        run: |
          cmake --build build --target spinelove_qt --parallel 4

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 5 ./build/main/qt/spinelove_qt --viewport 640x360 --fixed-size
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "smoke test failed with exit code $code"
            exit "$code"
          fi

      - name: Package
        run: |
          app_dir=build/main/qt
          dist_dir=dist/SpineLoveEX-linux-${{ matrix.artifact }}
          mkdir -p "$dist_dir"
          cp "$app_dir/spinelove_qt" "$dist_dir/spinelove"
          cp -r "$app_dir/NotoSansSC-Regular.ttf" "$app_dir/render_d3d11" "$dist_dir/"
          tar -C dist -czf "$dist_dir.tar.gz" SpineLoveEX-linux-${{ matrix.artifact }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SpineLoveEX-linux-${{ matrix.artifact }}
          path: dist/SpineLoveEX-linux-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            "dist/SpineLoveEX-linux-x64.tar.gz" \
            "dist/SpineLoveEX-linux-arm64.tar.gz" \
            --target "${{ github.sha }}" \
            --title "SpineLoveEX ${{ inputs.release_tag }}" \
            --generate-notes