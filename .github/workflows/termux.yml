name: Termux Build

# Builds the viewer for Termux (aarch64, Android Bionic libc) inside the
# official Termux container and packages it as a .deb.
#
# Live2D is disabled here: the bundled Cubism Core is glibc-only. The viewer
# itself (Spine runtimes + QML UI) builds and runs.

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - ".github/workflows/termux.yml"
      - "main/**"
      - "cmake/**"
      - "CMakeLists.txt"

permissions:
  contents: read

jobs:
  deb:
    # Termux's primary architecture is aarch64; the arm runner is native, so
    # no QEMU emulation is needed for the container.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build inside Termux
        run: |
          mkdir -p dist/termux-out
          chmod 777 dist/termux-out
          docker run --rm -v "$PWD:/work" -w /work termux/termux-docker:aarch64 bash -lc '
            set -e
            # Termux always lives here; the login shell does not necessarily
            # export $PREFIX, and pkg is not always on PATH for command -v.
            PREFIX_DIR=/data/data/com.termux/files/usr
            echo "--- environment ---"
            uname -m
            id -u

            # The image points at a rate limited mirror (HTTP 429) and does
            # not know the x11 repository that carries Qt6. Pin the official
            # mirrors in both apt config roots.
            main_line="deb https://packages.termux.dev/apt/termux-main stable main"
            x11_line="deb https://packages.termux.dev/apt/termux-x11 stable main"
            for apt_dir in "$PREFIX_DIR/etc/apt" /etc/apt; do
              mkdir -p "$apt_dir/sources.list.d" 2>/dev/null || true
              printf "%s\n%s\n" "$main_line" "$x11_line" > "$apt_dir/sources.list" 2>/dev/null || true
              printf "%s\n%s\n" "$main_line" "$x11_line" > "$apt_dir/sources.list.d/termux.list" 2>/dev/null || true
            done

            echo "--- installing packages ---"
            pkg update -y
            pkg install -y \
              clang cmake ninja pkg-config git \
              qt6-qtbase qt6-qtdeclarative qt6-qtshadertools

            # The Termux qt6-qtbase package ships the CMake config for its GTK3 platform
            # theme plugin without the plugin itself, which makes
            # find_package(Qt6 Gui) fail. Provide the file the config expects.
            echo "--- working around the GTK3 platform theme plugin ---"
            mkdir -p "$PREFIX_DIR/lib/qt6/plugins/platformthemes"
            touch "$PREFIX_DIR/lib/qt6/plugins/platformthemes/libqgtk3.so"

            echo "--- qt version ---"
            qmake6 -query QT_VERSION
            qt_version="$(qmake6 -query QT_VERSION)"

            # The mounted workspace is owned by the runner user, the container
            # runs as Termux, so build in the container home instead.
            echo "--- copying sources ---"
            rm -rf "$HOME/src"
            mkdir -p "$HOME/src"
            tar -C /work -cf - --exclude=./build-termux --exclude=./dist --exclude=./.git . \
              | tar -C "$HOME/src" -xf -
            cd "$HOME/src"

            echo "--- configure ---"
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSPINELOVE_ENABLE_LIVE2D=OFF \
              -DSPINELOVE_QT_VERSION="$qt_version"

            echo "--- build ---"
            cmake --build build --target spinelove_qt --parallel 4

            echo "--- smoke test (offscreen) ---"
            code=0
            QT_QPA_PLATFORM=offscreen timeout 5 ./build/main/qt/spinelove_qt \
              --viewport 640x360 --fixed-size || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
              echo "smoke test failed with exit code $code"
              exit "$code"
            fi

            echo "--- collecting artifacts ---"
            cp build/main/qt/spinelove_qt /work/dist/termux-out/
            cp build/main/qt/NotoSansSC-Regular.ttf /work/dist/termux-out/ 2>/dev/null || true
          '

      - name: Package .deb
        run: |
          set -e
          root=dist/spinelove-termux
          rm -rf "$root"
          mkdir -p "$root/DEBIAN" \
                   "$root/data/data/com.termux/files/usr/bin" \
                   "$root/data/data/com.termux/files/usr/share/spinelove"

          cp dist/termux-out/spinelove_qt "$root/data/data/com.termux/files/usr/share/spinelove/spinelove"
          cp dist/termux-out/NotoSansSC-Regular.ttf \
             "$root/data/data/com.termux/files/usr/share/spinelove/" 2>/dev/null || true

          cat > "$root/data/data/com.termux/files/usr/bin/spinelove" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          exec /data/data/com.termux/files/usr/share/spinelove/spinelove "$@"
          EOF
          chmod +x "$root/data/data/com.termux/files/usr/bin/spinelove"

          cat > "$root/DEBIAN/control" <<EOF
          Package: spinelove
          Version: 1.0.0
          Architecture: aarch64
          Maintainer: SpineLoveEX
          Depends: qt6-qtbase, qt6-qtdeclarative, qt6-qtshadertools
          Section: graphics
          Priority: optional
          Description: SpineLoveEX viewer for Termux
           Spine (all bundled runtimes) viewer with a Qt Quick interface.
          EOF

          dpkg-deb --build --root-owner-group "$root" dist/spinelove_1.0.0_aarch64.deb
          dpkg-deb --info dist/spinelove_1.0.0_aarch64.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: spinelove-termux-aarch64
          path: dist/spinelove_1.0.0_aarch64.deb
          if-no-files-found: error
